services:
  app:
    image: agent-studio-app:latest
    build:
      context: ../app
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: 'postgresql://agent_studio:${POSTGRES_PASSWORD:-agent-studio-local}@db:5432/agent_studio'
    volumes:
      - ../app:/app:ro
    expose:
      - "8000"
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_studio
      POSTGRES_USER: agent_studio
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-agent-studio-local}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_studio -d agent_studio"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DOMAIN: '${DOMAIN:-localhost}'
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    depends_on:
      - app

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
