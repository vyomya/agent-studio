# Blocks merging unless the reviewer approved AND the tester passed the latest code.
# Agents cannot weaken this gate: their GitHub token has no "workflow" scope,
# so GitHub rejects any push that edits files in .github/workflows/.
name: merge-gate

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  pull-requests: write
  issues: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: New commits invalidate earlier approvals
        if: github.event.action == 'synchronize'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.pull_request.number;
            for (const name of ['review:approved', 'test:passed']) {
              try {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number, name });
                core.info(`Removed ${name}: new commits need a fresh review and test.`);
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }

      - name: Require review and test gates
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: context.payload.pull_request.number,
            });
            const labels = pr.labels.map(l => l.name);
            // A PR that only changes docs/ has nothing to test: it needs the review gate only.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: pr.number, per_page: 100,
            });
            const docsOnly = files.length > 0 && files.every(f => f.filename.startsWith('docs/'));
            const required = docsOnly ? ['review:approved'] : ['review:approved', 'test:passed'];
            const missing = required.filter(l => !labels.includes(l));const blocking = ['review:changes-requested', 'test:failed'].filter(l => labels.includes(l));
            if (missing.length || blocking.length) {
              core.setFailed(
                `Merge blocked. Missing: ${missing.join(', ') || 'none'}. ` +
                `Blocking: ${blocking.join(', ') || 'none'}.`
              );
            } else {
              core.info(docsOnly ? 'Docs-only PR: review gate passed.' : 'Review and test gates passed.');
            }