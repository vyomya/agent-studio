# Agent Studio team configuration (no secrets). Read by agents/bin/wake.sh and scripts/install.sh.
REPO="vyomya/agent-studio"
AGENTS="architect lead builder-core builder-web reviewer tester"

# Per agent (hyphens become underscores in variable names):
#   RUNTIME   hermes | openclaw
#   MODEL     model id as the runtime expects it (OpenClaw: "provider/model"; Hermes: model name)
#   PROVIDER  provider id; also the lock group, so agents on the same provider never call it at the same time
#   FALLBACK  optional fallback model (OpenClaw only)
#   OFFSET    minute (0-9) of the 10-minute wake-up schedule; stagger them
# Model choice (verified on the VM, Tue Oct 13, each with a one-line smoke test):
#   Gemini 2.5 is retired for new API keys. Gemini 3.x Flash allows only 20 requests/day; Flash Lite allows 500/day.
#   Ollama Cloud free plan covers only gemma4, gpt-oss, and nemotron-3; one request at a time.
#   Hermes has no Groq provider, so Groq is used only from OpenClaw.
#   -> builders (most model calls) on the two Flash Lite models, one each, so their daily quotas never collide
#   -> architect, reviewer, lead (Hermes) on Ollama; they share one lock because the free plan allows 1 request at a time
#   -> tester shares gemini-3.1-flash-lite with builder-web (and its lock): tester runs are short, one per PR,
#      and the two together stay well under 500 requests/day. The lock means they never call it at the same time.
# PROVIDER is the lock group (agents with the same PROVIDER never call the model at the same time).
# For Hermes agents it is also passed as --provider, so it must be the real Hermes provider id.

AGENT_architect_RUNTIME=hermes
AGENT_architect_PROVIDER=ollama-cloud
AGENT_architect_MODEL="gpt-oss:120b"
AGENT_architect_OFFSET=1

AGENT_reviewer_RUNTIME=hermes
AGENT_reviewer_PROVIDER=ollama-cloud
AGENT_reviewer_MODEL="nemotron-3-super"
AGENT_reviewer_OFFSET=7

AGENT_lead_RUNTIME=hermes
AGENT_lead_PROVIDER=ollama-cloud
AGENT_lead_MODEL="gpt-oss:20b"
AGENT_lead_OFFSET=0

AGENT_builder_core_RUNTIME=openclaw
AGENT_builder_core_PROVIDER=gemini-35-lite
AGENT_builder_core_MODEL="google/gemini-3.5-flash-lite"
AGENT_builder_core_FALLBACK="google/gemini-3.5-flash-lite"
AGENT_builder_core_OFFSET=3

AGENT_builder_web_RUNTIME=openclaw
AGENT_builder_web_PROVIDER=gemini-31-lite
AGENT_builder_web_MODEL="google/gemini-3.1-flash-lite"
AGENT_builder_web_FALLBACK="google/gemini-3.1-flash-lite"
AGENT_builder_web_OFFSET=5

AGENT_tester_RUNTIME=openclaw
AGENT_tester_PROVIDER=gemini-31-lite
AGENT_tester_MODEL="google/gemini-3.1-flash-lite"
AGENT_tester_FALLBACK="google/gemini-3.5-flash-lite"
AGENT_tester_OFFSET=9

# Hard stop for one agent run, in minutes.
RUN_TIMEOUT_MIN=25
# Longest an agent waits for its provider lock before giving up until the next wake-up, in seconds.
PROVIDER_WAIT_SEC=600