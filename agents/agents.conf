# Agent Studio team configuration (no secrets). Read by agents/bin/wake.sh and scripts/install.sh.
REPO="vyomya/agent-studio"
AGENTS="architect lead builder-core builder-web reviewer tester"

# Per agent (hyphens become underscores in variable names):
#   RUNTIME   hermes | openclaw
#   MODEL     model id as the runtime expects it (OpenClaw: "provider/model"; Hermes: model name)
#   PROVIDER  provider id; also the lock group, so agents on the same provider never call it at the same time
#   FALLBACK  optional fallback model (OpenClaw only)
#   OFFSET    minute (0-9) of the 10-minute wake-up schedule; stagger them
# Model choice (Tue Oct 13), from scripts/check-model-keys.sh:
#   Ollama Cloud (free plan: 1 request at a time, small monthly allowance) -> low-frequency, high-judgment roles.
#   Gemini free tier (per-model daily quotas)                              -> high-volume roles; builders on
#                                                                             different models so quotas don't collide.
# PROVIDER is the lock group: agents with the same PROVIDER never call the model at the same time.
# For Hermes agents it is also passed as --provider. VERIFY the exact provider ids on the VM:
#   OpenClaw model strings are "<provider>/<model>"; Hermes takes -m <model> --provider <provider>.

AGENT_architect_RUNTIME=hermes
AGENT_architect_PROVIDER=ollama-cloud
AGENT_architect_MODEL="deepseek-v4-pro:0813"
AGENT_architect_OFFSET=1

AGENT_reviewer_RUNTIME=hermes
AGENT_reviewer_PROVIDER=ollama-cloud
AGENT_reviewer_MODEL="glm-5.3"
AGENT_reviewer_OFFSET=7

AGENT_lead_RUNTIME=hermes
AGENT_lead_PROVIDER=gemini
AGENT_lead_MODEL="gemini-2.5-flash-lite"
AGENT_lead_OFFSET=0

AGENT_builder_core_RUNTIME=openclaw
AGENT_builder_core_PROVIDER=gemini-flash
AGENT_builder_core_MODEL="google/gemini-2.5-flash"
AGENT_builder_core_FALLBACK=""
AGENT_builder_core_OFFSET=3

AGENT_builder_web_RUNTIME=openclaw
AGENT_builder_web_PROVIDER=gemini-flash-latest
AGENT_builder_web_MODEL="google/gemini-flash-latest"
AGENT_builder_web_FALLBACK=""
AGENT_builder_web_OFFSET=5

AGENT_tester_RUNTIME=openclaw
AGENT_tester_PROVIDER=gemini-lite
AGENT_tester_MODEL="google/gemini-2.5-flash-lite"
AGENT_tester_FALLBACK=""
AGENT_tester_OFFSET=9

# Hard stop for one agent run, in minutes.
RUN_TIMEOUT_MIN=25
# Longest an agent waits for its provider lock before giving up until the next wake-up, in seconds.
PROVIDER_WAIT_SEC=600