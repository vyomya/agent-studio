# Agent Studio team configuration (no secrets). Read by agents/bin/wake.sh and scripts/install.sh.
REPO="vyomya/agent-studio"
AGENTS="architect lead builder-core builder-web reviewer tester"

# Per agent (hyphens become underscores in variable names):
#   RUNTIME   hermes | openclaw
#   MODEL     model id as the runtime expects it (OpenClaw: "provider/model"; Hermes: model name)
#   PROVIDER  provider id; also the lock group, so agents on the same provider never call it at the same time
#   FALLBACK  optional fallback model (OpenClaw only)
#   OFFSET    minute (0-9) of the 10-minute wake-up schedule; stagger them
# Model choice (Oct 14, after a day of free-tier runs):
#   Gemini 2.5 is retired for new keys; free Gemini 3.x Flash Lite (500 req/day) is often overloaded (503).
#   Ollama Cloud free plan is a monthly token allowance (28% used in the first day), so it is kept for the
#   low-volume, high-judgement Hermes roles: architect (gpt-oss:120b), reviewer (nemotron-3-super), lead (gpt-oss:20b).
#   Builders do most of the model calls, so they moved to a small paid OpenAI model (GPT-6 Luna, $0.01/1M cached
#   input) with a hard budget below; when Luna fails or the budget is spent they fall back to free Gemini Flash Lite.
#   Builders no longer fall back to Ollama. The tester runs on nemotron-3-super (Ollama), a different family from the builders.
#   The reviewer stays on Nemotron so code is never reviewed by the family that wrote it.
# PROVIDER is the lock group (agents with the same PROVIDER never call the model at the same time).
# For Hermes agents it is also passed as --provider, so it must be the real Hermes provider id.

AGENT_architect_RUNTIME=hermes
AGENT_architect_PROVIDER=ollama-cloud
AGENT_architect_MODEL="gpt-oss:120b"
AGENT_architect_OFFSET=1

AGENT_reviewer_RUNTIME=hermes
AGENT_reviewer_PROVIDER=ollama-cloud
AGENT_reviewer_MODEL="nemotron-3-super"
AGENT_reviewer_OFFSET=7

AGENT_lead_RUNTIME=hermes
AGENT_lead_PROVIDER=ollama-cloud
AGENT_lead_MODEL="gpt-oss:20b"
AGENT_lead_OFFSET=0

AGENT_builder_core_RUNTIME=openclaw
AGENT_builder_core_PROVIDER=openai-core
AGENT_builder_core_MODEL="openai/gpt-6-luna"
AGENT_builder_core_FALLBACK="google/gemini-3.5-flash-lite"
AGENT_builder_core_OFFSET=3

AGENT_builder_web_RUNTIME=openclaw
AGENT_builder_web_PROVIDER=openai-web
AGENT_builder_web_MODEL="openai/gpt-6-luna"
AGENT_builder_web_FALLBACK="google/gemini-3.1-flash-lite"
AGENT_builder_web_OFFSET=5

AGENT_tester_RUNTIME=openclaw
# Tester moved off Gemini Flash Lite on 16 Oct: 3.5 Lite failed on every run and 3.1 Lite often ended a run with no
# verdict (6 empty runs on #6). nemotron-3-super is the reviewer's model, the most reliable on this board, and a
# different family from the builders (OpenAI). It shares the ollama-cloud lock with the Hermes agents (Ollama free
# tier: one request at a time). Both models are registered in OpenClaw by scripts/install.sh.
AGENT_tester_PROVIDER=ollama-cloud
AGENT_tester_MODEL="ollama-cloud/nemotron-3-super"
AGENT_tester_FALLBACK="ollama-cloud/gpt-oss:120b"
AGENT_tester_OFFSET=9
# Tester runs are short by design (code does pytest and the smoke checks); a stuck run ends after 12 minutes.
AGENT_tester_TIMEOUT_MIN=12

# Paid OpenAI models (builders only) stop at this spend, computed from the token ledger; the run then uses FALLBACK.
# Prices are USD per 1M tokens for the builders' model (check platform.openai.com/docs/pricing).
OPENAI_BUDGET_USD=1.25
OPENAI_PRICE_IN=0.10
OPENAI_PRICE_CACHED=0.01
OPENAI_PRICE_OUT=0.50

# Hard stop for one agent run, in minutes.
RUN_TIMEOUT_MIN=25
# Longest an agent waits for its provider lock before giving up until the next wake-up, in seconds.
PROVIDER_WAIT_SEC=600